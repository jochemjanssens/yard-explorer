<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#121316"/>
  <!-- 3x3 tiles; the filled ones form a yard around the centre -->
  <g fill="#3a3c42">
    <rect x="8" y="8" width="14" height="14"/><rect x="42" y="8" width="14" height="14"/>
    <rect x="8" y="42" width="14" height="14"/>
  </g>
  <g fill="#00e676">
    <rect x="25" y="8" width="14" height="14"/>
    <rect x="8" y="25" width="14" height="14"/><rect x="25" y="25" width="14" height="14"/><rect x="42" y="25" width="14" height="14"/>
    <rect x="25" y="42" width="14" height="14"/><rect x="42" y="42" width="14" height="14"/>
  </g>
</svg>
